services:
  webftpp:
    build: .
    container_name: webftpp
    ports:
      - "8001:80"
    env_file:
      - .env
    # default volumes for production: use named volume (persistent across container restarts)
    volumes:
      - webftpp_storage:/var/www/html/storage
      - webftpp_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped
    networks:
      - app_network
    # You can uncomment and use the dev profile to mount local folders for development
    profiles: ["prod"]

  # Development convenience service configuration (same service name but only active when using profile "dev")
  webftpp_dev:
    build: .
    container_name: webftpp_dev
    ports:
      - "8001:80"
    env_file:
      - .env
    # Development bind mounts so uploads and cache are visible on host
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./:/var/www/html
    restart: unless-stopped
    networks:
      - app_network
    profiles: ["dev"]

networks:
  app_network:
    driver: bridge

volumes:
  webftpp_storage:
    driver: local
  webftpp_cache:
    driver: local
