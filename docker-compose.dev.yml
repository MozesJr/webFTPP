version: "3.9"

services:
  webftpp:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: webftpp-dev
    ports:
      - "8001:80"      # Apache (Laravel)
      - "5173:5173"    # Vite HMR
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://148.230.97.68:8001"

      DB_CONNECTION: mysql
      DB_HOST: shared_mysql
      DB_PORT: "3306"
      DB_DATABASE: webftpp_db
      DB_USERNAME: laravel_user
      DB_PASSWORD: "L@r@velP@ssw0rd123"

      CACHE_DRIVER: file
      SESSION_DRIVER: file
      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      # Vite
      VITE_PORT: "5173"
      VITE_HOST: "0.0.0.0"
    volumes:
      # Source code
      - .:/var/www/html:delegated

      # Hindari node_modules/vendor ketimpa bind-mount & masalah izin host
      - webftpp_node_modules:/var/www/html/node_modules
      - webftpp_vendor:/var/www/html/vendor

      # Pastikan writable directories bisa ditulis Laravel
      - webftpp_storage:/var/www/html/storage
      - webftpp_bootstrap_cache:/var/www/html/bootstrap/cache

    # Jalankan perintah start dev (fix permission, clear caches, start vite + apache)
    command: >
      sh -lc "
        set -e;
        cd /var/www/html;

        # Pastikan folder penting ada & writeable
        mkdir -p storage/logs storage/framework/{cache,sessions,views} bootstrap/cache;
        chown -R www-data:www-data storage bootstrap/cache || true;
        chmod -R ug+rwX storage bootstrap/cache || true;

        # Siapkan .env kalau belum ada
        if [ ! -f .env ]; then
          cp .env.example .env || true;
        fi

        # Install composer kalau vendor kosong (pertama kali)
        if [ ! -f vendor/autoload.php ]; then
          composer install --no-interaction;
        fi

        # Install npm kalau node_modules kosong
        if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then
          npm install;
        fi

        # Dev mode: jangan cache route (ada duplicate name)
        php artisan route:clear || true;
        php artisan config:clear || true;
        php artisan view:clear || true;

        # Jalankan migrasi (nggak fail hard di dev)
        php artisan migrate --force || true;

        # Start Vite HMR di background
        (npm run dev -- --host 0.0.0.0 --port 5173 &) ;

        # FIX: pastikan apache2 kebaca walau PATH dari shell minimal
        export PATH=\"$PATH:/usr/sbin\";

        # Start Apache foreground
        exec apache2 -DFOREGROUND
      "
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

networks:
  app_network:
    external: true

volumes:
  webftpp_node_modules:
  webftpp_vendor:
  webftpp_storage:
  webftpp_bootstrap_cache:
