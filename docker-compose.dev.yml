services:
  webftpp:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: webftpp-dev
    ports:
      - "8001:80"        # Apache -> Laravel public
      - "5173:5173"      # Vite HMR
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://148.230.97.68:8001
      - DB_CONNECTION=mysql
      - DB_HOST=shared_mysql
      - DB_PORT=3306
      - DB_DATABASE=webftpp_db
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=L@r@velP@ssw0rd123
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      # Vite dev server host (biar bisa diakses dari luar)
      - VITE_HOST=0.0.0.0
    volumes:
      # Kode tetap bind-mount
      - .:/var/www/html
      # Runtime dirs pakai named volumes (izin aman untuk www-data)
      - webftpp_vendor:/var/www/html/vendor
      - webftpp_node_modules:/var/www/html/node_modules
      - webftpp_storage:/var/www/html/storage
      - webftpp_cache:/var/www/html/bootstrap/cache
    # Jalankan sebagai www-data agar file yang dibuat bisa ditulis balik
    user: "33:33"   # www-data:www-data
    restart: unless-stopped
    networks:
      - app_network

    # Start sequence dev: perbaiki izin -> clear caches -> (opsional) migrate -> start Vite -> start Apache
    command: >
      sh -lc "
        set -e;
        cd /var/www/html;
        # pastikan izin aman untuk log & cache
        chown -R www-data:www-data storage bootstrap/cache || true;
        chmod -R ug+rwX storage bootstrap/cache || true;

        # HINDARI route:cache di dev (biar masalah duplikat route name tidak nge-crash)
        php artisan route:clear || true;
        php artisan config:clear || true;
        php artisan view:clear || true;

        # migrate kalau ada (tidak fatal kalau tidak ada)
        php artisan migrate --force || true;

        # start Vite HMR di background
        (npm run dev -- --host 0.0.0.0 --port 5173 &) ;

        # start Apache (foreground)
        exec apache2-foreground
      "

volumes:
  webftpp_vendor:
  webftpp_node_modules:
  webftpp_storage:
  webftpp_cache:

networks:
  app_network:
    external: true
