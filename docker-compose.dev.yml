version: "3.9"

services:
  webftpp:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: webftpp-dev

    ports:
      - "8001:80"      # Apache (Laravel)
      - "5173:5173"    # Vite HMR

    # Use env from host .env file (mounted) OR you can override here
    env_file:
      - .env

    # Allow container to resolve host.docker.internal -> host gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # --- Ensure dev env overrides if necessary ---
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8001"

      # Database: point to host MySQL (host.docker.internal) and port on your machine (example 8889)
      # If you keep DB config in .env, you can skip these lines.
      #DB_CONNECTION: mysql
      #DB_HOST: host.docker.internal
      #DB_PORT: "8889"
      #DB_DATABASE: fakultas_website
      #DB_USERNAME: root
      #DB_PASSWORD: root

      # Laravel runtime settings (recommended for dev)
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      # Vite
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_HOST: "0.0.0.0"
      VITE_PORT: "5173"
      VITE_DEV_SERVER_URL: "http://localhost:5173"

    volumes:
      - .:/var/www/html:delegated
      - webftpp_node_modules:/var/www/html/node_modules
      - webftpp_vendor:/var/www/html/vendor
      - webftpp_storage:/var/www/html/storage
      - webftpp_bootstrap_cache:/var/www/html/bootstrap/cache

    command: > # (sama seperti yang sudah kamu punya)
      sh -lc "
        set -e
        cd /var/www/html
        mkdir -p storage/logs storage/framework/{cache,sessions,views} bootstrap/cache /var/log/apache2
        chown -R www-data:www-data storage bootstrap/cache public /var/log/apache2 || true
        chmod -R ug+rwX storage bootstrap/cache || true
        [ -f .env ] || cp .env.example .env || true
        export COMPOSER_ALLOW_SUPERUSER=1
        [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist || true
        [ -d node_modules ] && [ -n \"$(ls -A node_modules 2>/dev/null)\" ] || npm install
        php artisan route:clear  || true
        php artisan config:clear || true
        php artisan view:clear   || true
        php artisan migrate --force || true
        su -s /bin/sh -c 'npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5173}' www-data &
        . /etc/apache2/envvars
        mkdir -p ${APACHE_RUN_DIR} /var/lock/apache2
        chown -R www-data:www-data ${APACHE_RUN_DIR} /var/lock/apache2
        exec /usr/sbin/apache2 -DFOREGROUND
      "

    restart: unless-stopped
    networks:
      - app_network

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

networks:
  app_network:
    external: false

volumes:
  webftpp_node_modules:
  webftpp_vendor:
  webftpp_storage:
  webftpp_bootstrap_cache:
