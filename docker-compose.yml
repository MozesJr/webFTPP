services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fakultas-website-app
    container_name: fakultas_website_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:rw,cached
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
    restart: unless-stopped

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: fakultas-website-node
    container_name: fakultas_website_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:rw,cached
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
